version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: leadflow-mongo
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=leadflow
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: leadflow-server
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/leadflow
      - NODE_ENV=production
    ports:
      - "5000:5000"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: leadflow-client
    depends_on:
      - server
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mongo_data:
